[project]
name = "reconbrief"
version = "0.1.0"
description = "Public-data recon engine for cybersecurity sales."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "dnspython>=2.9.0",
    "python-pptx>=1.0.2",
    "typer>=0.12",
]

[project.scripts]
reconbrief = "reconbrief.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reconbrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
