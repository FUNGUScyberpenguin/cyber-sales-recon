[project]
name = "reconbrief"
version = "0.1.0"
description = "Public-data recon engine for cybersecurity sales."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
reconbrief = "reconbrief.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reconbrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
